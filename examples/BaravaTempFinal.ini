[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,0
MiddleMouseDownAction=!Execute [!Refresh]
OnRefreshAction=[!CommandMeasure MeasureHtifo "Run"]

[Metadata]
Name=Barava Temp
Author=Cryptokid
Version=1

[Variables]
Font=Space Age
DeviceIP=192.168.1.249

[MeasureHtifo]
Measure=Plugin
Plugin=RunCommand
Program=PowerShell
Parameter=pyrava heater --host #DeviceIP# --json
OutputFile=#CURRENTPATH#barava_temp.txt
State=Hide
OutputType=UTF8

[MeasureTrigger]
Measure=Calc
Formula=Counter
UpdateDivider=60
OnUpdateAction=[!CommandMeasure MeasureHtifo "Run"]
DynamicVariables=1

[MeasureTemp]
Measure=Plugin
Plugin=WebParser
URL=file://#CURRENTPATH#barava_temp.txt
RegExp="HTCT"\s*:\s*(\d+)
StringIndex=1

[MeasureFtemp]
Measure=Calc
Formula=MeasureTemp/100
DynamicVariables=1

[MeterTemp]
Meter=String
MeasureName=MeasureFtemp
X=110
Y=40
W=300
H=40
FontSize=22
FontFace=#Font#
FontColor=255,255,255,255
StringAlign=Center
StringEffect=Shadow
EffectOffsetX=1
EffectOffsetY=1
AntiAlias=1
NumOfDecimals=2
Text=%1°F